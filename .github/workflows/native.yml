name: Native

# Builds quiche as a shared library for every RID in the matrix and
# uploads each cell's staged output as an artifact. See
# docs/native-build-matrix.md for the design and per-cell rationale.
#
# Triggered on pull requests and manually (workflow_dispatch) so matrix
# branches can be exercised without merging to main first.

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: quiche (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - rid: win-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            msvc_arch: arm64
          - rid: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # linux-musl-arm64 is deliberately absent: rustc 1.99 drops
          # cdylib for aarch64-unknown-linux-musl ("dropping unsupported
          # crate type `cdylib`"), so no shared library is produced at
          # all. See docs/native-build-matrix.md. It returns if rustc
          # gains cdylib support for that target.
          - rid: linux-musl-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            musl: true
          - rid: osx-x64
            runner: macos-15
            target: x86_64-apple-darwin
          - rid: osx-arm64
            runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # BoringSSL needs NASM on Windows, and an MSVC environment.
      # boring-sys runs bindgen, which needs libclang on every platform:
      # LLVM via Chocolatey on Windows, Xcode's toolchain on macOS,
      # libclang-dev via apt on Linux (below).
      - name: Install NASM and LLVM (Windows)
        if: startsWith(matrix.runner, 'windows')
        run: choco install nasm llvm -y

      # win-arm64 builds BoringSSL with Ninja (see build.ps1): the VS
      # generator defaults to x64 and cannot be steered from a toolchain
      # file, so it picks x86_64 assembly for an aarch64 target.
      - name: Install Ninja (win-arm64)
        if: matrix.rid == 'win-arm64'
        run: choco install ninja -y

      # msvc_arch matters: the action defaults to x64 even on ARM
      # runners, which makes BoringSSL's cmake pick x86_64 assembly
      # for an aarch64 target (CI 2026-10-28).
      - name: Set up MSVC (Windows)
        if: startsWith(matrix.runner, 'windows')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch || 'x64' }}

      # musl cells: zig provides the musl C and C++ toolchain that
      # cargo-zigbuild wires up. musl-tools alone is not enough:
      # boring-sys's cmake derives a <triple>-g++ that does not exist.
      - name: Install Zig (musl)
        if: matrix.musl
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1

      - name: Install cargo-zigbuild (musl)
        if: matrix.musl
        run: cargo install cargo-zigbuild --locked

      - name: Install cmake and libclang (Linux)
        if: startsWith(matrix.runner, 'ubuntu')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake libclang-dev

      # Windows builds run under PowerShell via build.ps1, NOT under
      # Git Bash: bash shadows link.exe and mangles LIB/INCLUDE (see
      # native/build.ps1 header). All other RIDs use build.sh.
      - name: Build quiche for ${{ matrix.rid }} (Windows)
        if: startsWith(matrix.runner, 'windows')
        shell: pwsh
        run: .\native\build.ps1 -Rid ${{ matrix.rid }}

      - name: Build quiche for ${{ matrix.rid }}
        if: "!startsWith(matrix.runner, 'windows')"
        shell: bash
        run: bash native/build.sh ${{ matrix.rid }}

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiche-${{ matrix.rid }}
          path: native/out/${{ matrix.rid }}/
          if-no-files-found: error
