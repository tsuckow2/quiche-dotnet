name: Native

# Builds quiche as a shared library for every RID in the matrix and
# uploads each cell's staged output as an artifact. See
# docs/native-build-matrix.md for the design and per-cell rationale.
#
# Triggered on pull requests and manually (workflow_dispatch) so matrix
# branches can be exercised without merging to main first.

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: quiche (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - rid: win-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - rid: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - rid: linux-musl-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            musl: true
          - rid: linux-musl-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true
          - rid: osx-x64
            runner: macos-15
            target: x86_64-apple-darwin
          - rid: osx-arm64
            runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # BoringSSL needs NASM on Windows, and an MSVC environment.
      # boring-sys runs bindgen, which needs libclang on every platform:
      # LLVM via Chocolatey on Windows, Xcode's toolchain on macOS,
      # libclang-dev via apt on Linux (below).
      - name: Install NASM and LLVM (Windows)
        if: startsWith(matrix.runner, 'windows')
        run: choco install nasm llvm -y

      - name: Set up MSVC (Windows)
        if: startsWith(matrix.runner, 'windows')
        uses: ilammy/msvc-dev-cmd@v1

      # musl cells: the musl C compiler for the host arch, so
      # BoringSSL's C code links musl instead of glibc.
      - name: Install musl-tools
        if: matrix.musl
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools cmake libclang-dev

      - name: Install cmake and libclang (Linux, non-musl)
        if: startsWith(matrix.runner, 'ubuntu') && !matrix.musl
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake libclang-dev

      - name: Build quiche for ${{ matrix.rid }}
        shell: bash
        env:
          MUSL_CC: musl-gcc
        run: bash native/build.sh ${{ matrix.rid }}

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiche-${{ matrix.rid }}
          path: native/out/${{ matrix.rid }}/
          if-no-files-found: error
